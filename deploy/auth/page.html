<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#183e30"><title>登录 · 签数</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:32px 20px;background:#f5f6ef;color:#183e30;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif}.shell{width:100%;max-width:448px}.brand{display:flex;align-items:center;gap:12px;margin-bottom:32px;font-size:21px;letter-spacing:.03em}.mark{display:grid;place-items:center;width:38px;height:38px;background:#183e30;border-radius:11px;color:#eef2df;font-size:24px}.brand small{font-size:10px;color:#7a8977;letter-spacing:.14em;margin-left:auto}.card{background:#fff;border:1px solid #dce2d4;border-radius:24px;padding:36px;box-shadow:0 14px 48px #183e3007}.eyebrow{color:#788c65;font-size:12px;letter-spacing:.15em;margin:0 0 13px}h1{font-size:29px;line-height:1.4;letter-spacing:-.04em;margin:0 0 8px}h2{font-size:20px;margin:24px 0 8px}.description{font-size:14px;line-height:1.8;color:#7b8579;margin:0 0 26px}label{display:block;font-size:13px;font-weight:600;margin:20px 0 9px}input:not([type=checkbox]){width:100%;padding:13px 14px;border:1px solid #dce2d4;background:#fafbf7;border-radius:10px;font-size:16px;color:#183e30}input:focus{outline:2px solid #94a77b;outline-offset:2px}.remember{display:flex;gap:10px;align-items:flex-start;font-size:14px;font-weight:500;margin:22px 0}.remember input{width:18px;height:18px;accent-color:#40623f;margin:1px 0}.remember small{display:block;font-size:12px;font-weight:400;color:#88917f;margin-top:5px}button{width:100%;padding:15px;border:0;border-radius:11px;background:#183e30;color:#f9fcf5;font-size:16px;font-weight:600;cursor:pointer;display:flex;justify-content:space-between}button:hover{background:#2c523c}.message{color:#a03f32;font-size:13px;line-height:1.7;margin:15px 0}.message:empty{display:none}.foot{font-size:12px;line-height:1.9;color:#929a8b;text-align:center;margin:24px 0 0}.back{display:block;text-align:center;font-size:14px;color:#40623f;margin-top:22px;text-decoration:none}.footer{text-align:center;margin-top:24px;font-size:12px;color:#929a8b}@media(max-width:480px){.card{padding:28px 24px}.brand{margin-bottom:24px}}
</style></head><body><main class="shell"><div class="brand"><span class="mark" aria-hidden="true">▦</span><strong>签数</strong><small>LABEL COUNTER</small></div><section class="card"><p class="eyebrow">你的标签工作台</p><h1>登录，继续每一张。</h1><p class="description">标签库与打印工具，随时回来使用。</p><p class="message" role="alert">{{message}}</p>{{content}}</section><p class="footer">签数 · 私人标签库</p></main></body></html>
